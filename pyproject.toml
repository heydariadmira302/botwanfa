[build-system]
requires = ['hatchling>=1.25']
build-backend = 'hatchling.build'

[project]
name = 'botwanfa'
version = '0.1.0'
description = 'Async multi-group dice game bot'
requires-python = '>=3.12'
dependencies = [
  'aiogram>=3.13,<4',
  'SQLAlchemy[asyncio]>=2.0.36,<3',
  'asyncpg>=0.30,<1',
  'argon2-cffi>=23.1,<26',
  'cryptography>=44,<47',
  'alembic>=1.14,<2',
  'redis>=5.2,<6',
  'arq>=0.26,<1',
  'pydantic-settings>=2.7,<3',
  'Pillow>=11,<12',
  'structlog>=24.4,<26',
  'tzdata>=2025.2',
]

[project.optional-dependencies]
dev = ['pytest>=8.3,<9', 'pytest-asyncio>=0.25,<1', 'ruff>=0.9,<1']

[project.scripts]
botwanfa = 'botwanfa.__main__:main'

[tool.hatch.build.targets.wheel]
packages = ['src/botwanfa']

[tool.pytest.ini_options]
pythonpath = ['src']
asyncio_mode = 'auto'
testpaths = ['tests']

[tool.ruff]
line-length = 100
target-version = 'py312'
